name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    # Por defecto en GitHub (ubuntu-latest). Con la variable CI_RUNS_ON='["self-hosted","macOS"]' corre en el Mac
    # de Said (como finanzas-app #696, facturación de Actions bloqueada 16-nov). Borrar la variable vuelve a GitHub.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
