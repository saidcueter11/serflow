name: supabase-migrations

# PR: `supabase db push --dry-run` lista lo que se aplicaría en prod.
# Push a master: `supabase db push` aplica en prod solo las migraciones nuevas.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migrations.yml'
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'

permissions:
  contents: read

# Los push a prod van de a uno, sin cancelar uno a medias.
concurrency:
  group: supabase-migrations-${{ github.event_name == 'push' && 'prod' || github.ref }}
  cancel-in-progress: false

jobs:
  migrations:
    # PRs de forks no reciben los secrets: el job no corre ahí.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: github.event_name == 'pull_request'
        run: supabase db push --dry-run
      - if: github.event_name == 'push'
        run: supabase db push --yes
