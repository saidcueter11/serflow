name: supabase-migrations

# PR: `supabase db push --dry-run` lista lo que se aplicaría en prod, con un rol de solo lectura.
# Push a master: `supabase db push` aplica en prod solo las migraciones nuevas.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migrations.yml'
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'

permissions:
  contents: read

# Los push a prod van de a uno, sin cancelar uno a medias.
concurrency:
  group: supabase-migrations-${{ github.event_name == 'push' && 'prod' || github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    # PRs de forks no reciben secrets: el job no corre ahí.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.116.0
      # Rol migrations_ro: solo puede leer supabase_migrations.schema_migrations.
      - run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL_RO"
        env:
          SUPABASE_DB_URL_RO: ${{ secrets.SUPABASE_DB_URL_RO }}

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # SUPABASE_DB_URL vive en este environment, limitado a master: una rama no puede leerlo.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.116.0
      - run: supabase db push --yes --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
